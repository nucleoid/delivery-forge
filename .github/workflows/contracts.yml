name: contracts

on:
  pull_request:
    paths:
      - "components/contracts/**"
      - "components/coordination/**"
      - "components/execution/**"
      - "components/evidence/**"
      - "components/planning/**"
      - "components/review/**"
      - "components/end-to-end/**"
      - "components/publication/**"
      - "components/scheduling/**"
      - "components/tool/**"
      - "SKILL.md"
      - "docs/**"
      - "DeliveryForge.slnx"
      - "Directory.*.props"
      - "global.json"
      - "references/**"
      - ".github/workflows/contracts.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_PROCESSOR_COUNT: "2"
      DOTNET_GCHeapHardLimit: "0x100000000"
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: "1"
      MSBUILDDISABLENODEREUSE: "1"
      UseSharedCompilation: "false"
      BuildInParallel: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - run: dotnet restore DeliveryForge.slnx --locked-mode
      - name: Build actual owned lifecycle helper and bind fixture inputs
        shell: pwsh
        run: |
          $helperOutput = Join-Path $env:RUNNER_TEMP ('delivery-forge-owned-tree-helper-' + [guid]::NewGuid().ToString('N'))
          dotnet build components/evidence/DeliveryForge.Evidence.Tests/Fixtures/OwnedProcessTreeHelper/OwnedProcessTreeHelper.csproj --configuration Release --disable-build-servers -m:1 -p:UseSharedCompilation=false -p:BuildInParallel=false -o $helperOutput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hostCommand = Get-Command dotnet -CommandType Application | Select-Object -First 1
          $helperDll = Join-Path $helperOutput 'OwnedProcessTreeHelper.dll'
          if (-not (Test-Path -LiteralPath $hostCommand.Source) -or -not (Test-Path -LiteralPath $helperDll)) { throw 'Actual SDK/helper binding is missing' }
          "DELIVERY_FORGE_DOTNET_HOST=$($hostCommand.Source)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DELIVERY_FORGE_LIFECYCLE_HELPER_DLL=$helperDll" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build actual bounded review preparation helper
        shell: pwsh
        run: |
          $reviewHelperOutput = Join-Path $env:RUNNER_TEMP ('delivery-forge-review-helper-' + [guid]::NewGuid().ToString('N'))
          dotnet build components/execution/DeliveryForge.Execution.Tests/Fixtures/BoundedGitPreparationHelper/BoundedGitPreparationHelper.csproj --configuration Release --disable-build-servers -m:1 -p:UseSharedCompilation=false -p:BuildInParallel=false -o $reviewHelperOutput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $reviewAppHost = Join-Path $reviewHelperOutput $(if ($IsWindows) { 'BoundedGitPreparationHelper.exe' } else { 'BoundedGitPreparationHelper' })
          if (-not (Test-Path -LiteralPath $reviewAppHost -PathType Leaf)) { throw 'Actual review helper apphost is missing' }
          "DELIVERY_FORGE_REVIEW_GIT_NEGATIVE_HELPER=$reviewAppHost" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build actual selected importer Git helper
        shell: pwsh
        run: |
          $importHelperOutput = Join-Path $env:RUNNER_TEMP ('delivery-forge-import-helper-' + [guid]::NewGuid().ToString('N'))
          dotnet build components/planning/DeliveryForge.Planning.ImportGitHelper/DeliveryForge.Planning.ImportGitHelper.csproj --no-restore --configuration Release --disable-build-servers -m:1 -p:UseSharedCompilation=false -p:BuildInParallel=false -o $importHelperOutput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $importAppHost = Join-Path $importHelperOutput $(if ($IsWindows) { 'DeliveryForge.Planning.ImportGitHelper.exe' } else { 'DeliveryForge.Planning.ImportGitHelper' })
          if (-not (Test-Path -LiteralPath $importAppHost -PathType Leaf)) { throw 'Actual importer helper apphost is missing' }
          "DELIVERY_FORGE_IMPORT_GIT_HELPER=$importAppHost" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build actual parent crash driver
        shell: pwsh
        run: |
          $driverOutput = Join-Path $env:RUNNER_TEMP ('delivery-forge-crash-driver-' + [guid]::NewGuid().ToString('N'))
          dotnet build components/end-to-end/DeliveryForge.EndToEnd.CrashDriver/DeliveryForge.EndToEnd.CrashDriver.csproj --configuration Release --disable-build-servers -m:1 -p:UseSharedCompilation=false -p:BuildInParallel=false -o $driverOutput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $driverDll = Join-Path $driverOutput 'DeliveryForge.EndToEnd.CrashDriver.dll'
          if (-not (Test-Path -LiteralPath $driverDll)) { throw 'Actual parent crash driver build output is missing' }
          "DELIVERY_FORGE_ACTUAL_CRASH_DRIVER_DLL=$driverDll" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build genuine duplex process fixture and complete output binding
        shell: pwsh
        run: |
          $duplexOutput = Join-Path $env:RUNNER_TEMP ('delivery-forge-duplex-fixture-' + [guid]::NewGuid().ToString('N'))
          dotnet build components/tool/DeliveryForge.Tool.DuplexFixture/DeliveryForge.Tool.DuplexFixture.csproj --no-restore --configuration Release --disable-build-servers -m:1 -p:UseSharedCompilation=false -p:BuildInParallel=false -o $duplexOutput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $duplexImage = Join-Path $duplexOutput $(if ($IsWindows) { 'DeliveryForge.Tool.DuplexFixture.exe' } else { 'DeliveryForge.Tool.DuplexFixture' })
          $duplexFiles = @(Get-ChildItem -LiteralPath $duplexOutput -File | Sort-Object FullName | ForEach-Object { @{ Path=$_.FullName; Bytes=$_.Length; Sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() } })
          if ($duplexFiles.Count -ne 5 -or -not (Test-Path -LiteralPath $duplexImage -PathType Leaf)) { throw 'Actual complete duplex apphost/runtime/PDB output is required' }
          $duplexBinding = Join-Path $env:RUNNER_TEMP ('delivery-forge-duplex-binding-' + [guid]::NewGuid().ToString('N') + '.json')
          @{ Image=$duplexImage; Files=$duplexFiles } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $duplexBinding -Encoding utf8NoBOM -NoNewline
          "DELIVERY_FORGE_DUPLEX_FIXTURE_MANIFEST=$duplexBinding" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build genuine disposable tool package for installed-binary tests
        shell: pwsh
        run: |
          $toolPackageOutput = Join-Path $env:RUNNER_TEMP ('delivery-forge-tool-package-' + [guid]::NewGuid().ToString('N'))
          dotnet pack components/tool/DeliveryForge.Tool/DeliveryForge.Tool.csproj --no-restore --configuration Release --disable-build-servers -m:1 -p:UseSharedCompilation=false -p:BuildInParallel=false -o $toolPackageOutput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $toolPackages = @(Get-ChildItem -LiteralPath $toolPackageOutput -Filter 'DeliveryForge.Tool.*.nupkg' -File)
          if ($toolPackages.Count -ne 1) { throw 'Exactly one actual Tool package is required' }
          $toolPackage = $toolPackages[0]
          $toolPackageSha = (Get-FileHash -LiteralPath $toolPackage.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "DELIVERY_FORGE_TOOL_PACKAGE=$($toolPackage.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DELIVERY_FORGE_TOOL_PACKAGE_SHA256=$toolPackageSha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run public tests with explicitly configured host fixtures
        shell: pwsh
        run: |
          # Installed quality rows require their separate admitted profile/manifest run.
          $publicFilter = "FullyQualifiedName!=DeliveryForge.Tool.Tests.InstalledNativeHostConformanceTests.Actual_installed_native_task_accepts_exact_assignment_commits_then_refuses_foreign_completion&FullyQualifiedName!=DeliveryForge.Tool.Tests.InstalledNativeHostConformanceTests.Actual_installed_live_session_stops_only_through_its_same_original_group&FullyQualifiedName!=DeliveryForge.Tool.Tests.InstalledPackageGoldenTests.Actual_packaged_binary_on_this_OS_help_version_capabilities_dryrun_and_reinstall&FullyQualifiedName!=DeliveryForge.Tool.Tests.OwnedDuplexProcessTests.Actual_duplex_roundtrip_complete_EOF_and_same_first_retirement&FullyQualifiedName!=DeliveryForge.Tool.Tests.OwnedDuplexProcessTests.Actual_blocked_stdout_is_stopped_by_original_owner_not_terminal_text&FullyQualifiedName!=DeliveryForge.Tool.Tests.OwnedDuplexProcessTests.Actual_blocked_stdin_records_original_task_and_cancellation_without_replay&FullyQualifiedName!=DeliveryForge.Tool.Tests.OwnedDuplexProcessTests.Actual_stderr_overflow_is_retained_failure_not_truncated_success&FullyQualifiedName!=DeliveryForge.Tool.Tests.OwnedDuplexProcessTests.Known_actual_creator_failure_retains_frame_and_never_claims_child_exit_zero&FullyQualifiedName!=DeliveryForge.Tool.Tests.OwnedDuplexProcessTests.Parent_exit_and_pipe_EOF_with_surviving_child_never_certify_Linux_group_zero&FullyQualifiedName!=DeliveryForge.Tool.Tests.OwnedLinuxOrdinaryCaptureTests.Genuine_ordinary_capture_reuses_creation_scope_and_original_work_before_foreign_budget_refusal&FullyQualifiedName!=DeliveryForge.Tool.Tests.OwnedLinuxScopeProcessTests.Actual_fast_target_returns_only_after_real_scope_empty_and_disposition&FullyQualifiedName!=DeliveryForge.Tool.Tests.OwnedLinuxScopeProcessTests.Actual_partial_birth_READY_never_releases_target_and_real_bound_group_retires&FullyQualifiedName!=DeliveryForge.Tool.Tests.PackageLifecycleTests.Genuine_owned_gate_install_records_execute_mode_and_refuses_drift_before_resume_deletion&FullyQualifiedName!=DeliveryForge.Tool.Tests.StandardToolInstallTests.Genuine_local_tool_install_shim_uninstall_reinstall_on_this_OS&FullyQualifiedName!=DeliveryForge.Tool.Tests.ParentNativeContinuumLiveTests.Actual_parent_native_fixture_completion_releases_four_current_leases&FullyQualifiedName!=DeliveryForge.Tool.Tests.ParentNativeContinuumLiveTests.Actual_parent_external_loss_blocks_effects_and_preserves_four_successors&FullyQualifiedName!=DeliveryForge.Tool.Tests.ParentNativeContinuumLiveTests.Actual_parent_active_native_lease_loss_stops_same_original_and_preserves_successors&FullyQualifiedName!=DeliveryForge.Tool.Tests.OwnedCleanupObservationTests.Actual_same_owned_native_stop_writes_checkpoint_under_original_cleanup_only&FullyQualifiedName!=DeliveryForge.Tool.Tests.OwnedCleanupObservationTests.Actual_expired_original_cleanup_refuses_before_any_owned_git_invocation&FullyQualifiedName!=DeliveryForge.Evidence.Tests.RealInstalledQualityToolTests.Real_installed_process_report_and_current_source_are_joined"
          # Every live Continuum row needs its separately admitted private UAT profile.
          # Public contract CI is not live/profile certification.
          $publicFilter += "&Category!=LiveContinuumAcceptance"
          if ($IsWindows) { $publicFilter += "&FullyQualifiedName!=DeliveryForge.Evidence.Tests.InstalledToolProfileTests.Unsupported_current_owner_refuses_before_tool_birth_or_artifact_writes" }
          dotnet test DeliveryForge.slnx --no-restore --configuration Release --disable-build-servers -m:1 -p:UseSharedCompilation=false -p:BuildInParallel=false --filter $publicFilter
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: dotnet format DeliveryForge.slnx --no-restore --verify-no-changes
