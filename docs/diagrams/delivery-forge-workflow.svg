<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
<title id="title">Delivery Forge end-to-end workflow</title><desc id="desc">Workflow from plan and freeze through readiness, isolated red-green implementation, layered quality evidence, exact-head review, authorized pull request, continuous integration, and separately authorized protected merge. Findings or head changes invalidate stale review. Pause or uncertainty fails closed. Release and deployment are excluded.</desc>
<defs><style>.bg{fill:#071525}.core{fill:#0b2d35;stroke:#21b6a8;stroke-width:2}.target{fill:#251d43;stroke:#8b72e8;stroke-width:2}.gate{fill:#352812;stroke:#e4a83c;stroke-width:2}.neutral{fill:#102942;stroke:#52718e;stroke-width:2}.title{fill:#f4f8fb;font:700 36px 'DejaVu Sans',sans-serif}.subtitle{fill:#9fb3c5;font:400 17px 'DejaVu Sans',sans-serif}.h{fill:#f4f8fb;font:700 18px 'DejaVu Sans',sans-serif}.b{fill:#c9d7e2;font:400 14px 'DejaVu Sans',sans-serif}.small{fill:#aebfcd;font:400 13px 'DejaVu Sans',sans-serif}.pill{font:700 13px 'DejaVu Sans',sans-serif}.step{fill:#071525;font:700 15px 'DejaVu Sans',sans-serif}.arrow{fill:none;stroke:#6f8aa2;stroke-width:3;marker-end:url(#a)}.loop{fill:none;stroke:#e4a83c;stroke-width:3;stroke-dasharray:10 7;marker-end:url(#ag)}.fail{fill:none;stroke:#db7182;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#ar)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#6f8aa2"/></marker><marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#e4a83c"/></marker><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#db7182"/></marker></defs>
<rect class="bg" width="1800" height="900" rx="24"/><text class="title" x="70" y="70">Delivery Forge end-to-end workflow</text><text class="subtitle" x="70" y="102">Each transition is evidence-bound; authority never grows implicitly</text>
<g transform="translate(1120 48)"><rect class="core" width="190" height="38" rx="19"/><circle cx="22" cy="19" r="7" fill="#21b6a8"/><text class="pill" fill="#d9fffa" x="38" y="24">Integrated core</text><rect class="target" x="205" width="190" height="38" rx="19"/><circle cx="227" cy="19" r="7" fill="#8b72e8"/><text class="pill" fill="#eee8ff" x="243" y="24">Target / proposed</text><rect class="gate" x="410" width="220" height="38" rx="19"/><circle cx="432" cy="19" r="7" fill="#e4a83c"/><text class="pill" fill="#fff1cd" x="448" y="24">External / gated</text></g>
<circle cx="105" cy="195" r="22" fill="#21b6a8"/><text class="step" x="100" y="201">1</text><rect class="core" x="140" y="140" width="270" height="120" rx="14"/><text class="h" x="168" y="181">Plan</text><text class="b" x="168" y="211">Resolve intent, scope, acceptance,</text><text class="b" x="168" y="232">dependencies, tests, exclusions</text><path class="arrow" d="M410 200H455"/>
<circle cx="490" cy="195" r="22" fill="#21b6a8"/><text class="step" x="485" y="201">2</text><rect class="core" x="525" y="140" width="270" height="120" rx="14"/><text class="h" x="553" y="181">Freeze</text><text class="b" x="553" y="211">Bind plan revision, base SHA,</text><text class="b" x="553" y="232">authorization ceiling</text><path class="arrow" d="M795 200H840"/>
<circle cx="875" cy="195" r="22" fill="#e4a83c"/><text class="step" x="870" y="201">3</text><rect class="gate" x="910" y="125" width="370" height="150" rx="14"/><text class="h" x="938" y="165">Readiness gate</text><text class="b" x="938" y="195">Dependencies integrated · capabilities proven</text><text class="b" x="938" y="218">ownership established · conflicts serialized</text><text class="small" x="938" y="249">Optional Switchyard only after #30 readiness</text><path class="arrow" d="M1280 200H1325"/>
<circle cx="1360" cy="195" r="22" fill="#21b6a8"/><text class="step" x="1355" y="201">4</text><rect class="core" x="1395" y="140" width="335" height="120" rx="14"/><text class="h" x="1423" y="181">Isolated RED → GREEN</text><text class="b" x="1423" y="211">One writer/worktree · bounded scope</text><text class="b" x="1423" y="232">Durable checkpoints</text>
<path class="arrow" d="M1562 260V330H1495"/><circle cx="1460" cy="410" r="22" fill="#21b6a8"/><text class="step" x="1455" y="416">5</text><rect class="core" x="1160" y="345" width="265" height="130" rx="14"/><text class="h" x="1188" y="384">Layered evidence</text><text class="b" x="1188" y="414">Affected → full → build</text><text class="b" x="1188" y="436">Crap4CSharp → Mutate4CSharp</text><text class="small" x="1188" y="460">Missing evidence cannot pass</text><path class="arrow" d="M1160 410H1110"/>
<circle cx="1075" cy="410" r="22" fill="#8b72e8"/><text class="step" x="1070" y="416">6</text><rect class="target" x="755" y="345" width="285" height="130" rx="14"/><text class="h" x="783" y="384">Exact-head review</text><text class="b" x="783" y="414">Independent reviewer binds patch,</text><text class="b" x="783" y="436">commit, tree, plan, and evidence</text><text class="small" x="783" y="460">Later changes invalidate this review</text><path class="arrow" d="M755 410H705"/>
<circle cx="670" cy="410" r="22" fill="#21b6a8"/><text class="step" x="665" y="416">7</text><rect class="core" x="435" y="345" width="200" height="130" rx="14"/><text class="h" x="463" y="384">Authorized PR</text><text class="b" x="463" y="414">Parent publishes exact</text><text class="b" x="463" y="436">evaluated head</text><path class="arrow" d="M435 410H385"/>
<circle cx="350" cy="410" r="22" fill="#21b6a8"/><text class="step" x="345" y="416">8</text><rect class="core" x="140" y="345" width="175" height="130" rx="14"/><text class="h" x="168" y="384">CI</text><text class="b" x="168" y="414">Required checks</text><text class="b" x="168" y="436">+ remote readback</text><path class="arrow" d="M227 475V535H345"/>
<circle cx="380" cy="595" r="22" fill="#8b72e8"/><text class="step" x="375" y="601">9</text><rect class="target" x="415" y="535" width="355" height="120" rx="14"/><text class="h" x="443" y="574">Separately authorized merge</text><text class="b" x="443" y="604">Protected normal merge · exact head</text><text class="small" x="443" y="630">No release or deployment authority implied</text>
<path class="loop" d="M897 345V305H1340V235H1395"/><rect class="gate" x="785" y="284" width="460" height="42" rx="21"/><text class="pill" fill="#fff1cd" x="814" y="310">Findings or head changes invalidate stale review and loop back</text>
<path class="fail" d="M1095 275V705H980"/><path class="fail" d="M1292 475V705H980"/><path class="fail" d="M897 475V705H980"/><path class="fail" d="M535 475V705H980"/><rect x="645" y="680" width="335" height="96" rx="14" fill="#351b27" stroke="#db7182" stroke-width="2"/><text class="h" x="675" y="719">Fail closed</text><text class="b" x="675" y="747">Pause, uncertainty, drift, or incomplete evidence</text><text class="small" x="675" y="768">Stop new work/publication; reconcile before continuing</text>
<rect class="neutral" x="1070" y="690" width="460" height="72" rx="14"/><text class="h" x="1100" y="723">Explicitly excluded from this workflow</text><text class="b" x="1100" y="749">Release · deployment · migration · secret/config changes</text><text class="small" x="70" y="840">Implementation remains paused by issue #17. Integrated cores and fixtures do not establish a certified production profile.</text>
</svg>
