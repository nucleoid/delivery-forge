<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
<title id="title">Delivery Forge architecture</title><desc id="desc">Layered Delivery Forge architecture: user intent, frozen plan, parent control, optional Continuum memory and Engram code intelligence, coding-agent clients, isolated workers, optional readiness-gated Switchyard transport, quality evidence, exact-head review, and parent-owned publication and recovery.</desc>
<defs><style>.bg{fill:#071525}.core{fill:#0b2d35;stroke:#21b6a8;stroke-width:2}.target{fill:#251d43;stroke:#8b72e8;stroke-width:2}.gate{fill:#352812;stroke:#e4a83c;stroke-width:2}.neutral{fill:#102942;stroke:#52718e;stroke-width:2}.title{fill:#f4f8fb;font:700 36px 'DejaVu Sans',sans-serif}.subtitle{fill:#9fb3c5;font:400 17px 'DejaVu Sans',sans-serif}.section{fill:#c7d7e4;font:700 18px 'DejaVu Sans',sans-serif;letter-spacing:1px}.h{fill:#f4f8fb;font:700 20px 'DejaVu Sans',sans-serif}.b{fill:#c9d7e2;font:400 15px 'DejaVu Sans',sans-serif}.small{fill:#aebfcd;font:400 13px 'DejaVu Sans',sans-serif}.pill{font:700 13px 'DejaVu Sans',sans-serif}.arrow{fill:none;stroke:#6f8aa2;stroke-width:3;marker-end:url(#a)}.arrowGate{fill:none;stroke:#e4a83c;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#ag)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#6f8aa2"/></marker><marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#e4a83c"/></marker></defs>
<rect class="bg" width="1800" height="1200" rx="24"/><text class="title" x="70" y="70">Delivery Forge architecture</text><text class="subtitle" x="70" y="102">Agent-neutral delivery control with exact-head evidence and fail-closed publication</text>
<g transform="translate(1120 48)"><rect class="core" width="190" height="38" rx="19"/><circle cx="22" cy="19" r="7" fill="#21b6a8"/><text class="pill" fill="#d9fffa" x="38" y="24">Integrated core</text><rect class="target" x="205" width="190" height="38" rx="19"/><circle cx="227" cy="19" r="7" fill="#8b72e8"/><text class="pill" fill="#eee8ff" x="243" y="24">Target / proposed</text><rect class="gate" x="410" width="220" height="38" rx="19"/><circle cx="432" cy="19" r="7" fill="#e4a83c"/><text class="pill" fill="#fff1cd" x="448" y="24">External / gated</text></g>
<text class="section" x="70" y="150">1 · INTENT AND CONTROL</text><rect class="neutral" x="70" y="175" width="340" height="120" rx="14"/><text class="h" x="100" y="218">User intent + authorized mode</text><text class="b" x="100" y="250">Scope, acceptance, constraints</text><text class="b" x="100" y="274">plan · implement · PR · merge</text><path class="arrow" d="M410 235H475"/><rect class="core" x="475" y="175" width="360" height="120" rx="14"/><text class="h" x="505" y="218">Frozen shared plan</text><text class="b" x="505" y="250">Plan revision hash + base SHA</text><text class="b" x="505" y="274">Dependencies, tests, exclusions</text><path class="arrow" d="M835 235H900"/><rect class="core" x="900" y="175" width="830" height="120" rx="14"/><text class="h" x="930" y="214">Parent control plane</text><text class="b" x="930" y="246">Owns readiness, queue, authorization ceilings, ownership, dispatch, remote mutation, cleanup</text><text class="b" x="930" y="272">Local manifests and append-only receipts are execution authority; uncertainty stops progress</text><path class="arrow" d="M1315 295V340"/>
<text class="section" x="70" y="350">2 · OPTIONAL CONTEXT AND READINESS</text><rect class="target" x="70" y="375" width="360" height="120" rx="14"/><text class="h" x="100" y="415">Continuum / memory context</text><text class="b" x="100" y="447">Distilled decisions and outcomes</text><text class="small" x="100" y="476">Not queue, checkpoint, lease, or live truth</text><rect class="target" x="455" y="375" width="360" height="120" rx="14"/><text class="h" x="485" y="415">Engram code intelligence</text><text class="b" x="485" y="447">Repository, symbols, flows, impact</text><text class="small" x="485" y="476">Freshness and completeness remain explicit</text><path class="arrow" d="M250 495V535H850V405H900"/><path class="arrow" d="M635 495V548H875V455H900"/><rect class="core" x="900" y="350" width="830" height="170" rx="14"/><text class="h" x="930" y="390">Capability and ownership readiness</text><text class="b" x="930" y="422">Detect versions and operations · bind dependency state · establish one writer/worktree</text><text class="b" x="930" y="450">Integrated coordination fails closed; production leased locks remain external and unproven</text><rect class="gate" x="930" y="472" width="480" height="30" rx="15"/><text class="pill" fill="#fff1cd" x="950" y="492">Future atomic leased-lock service ≠ Continuum memory</text><path class="arrow" d="M1315 520V565"/>
<text class="section" x="70" y="575">3 · EXECUTION</text><rect class="neutral" x="70" y="600" width="500" height="165" rx="14"/><text class="h" x="100" y="640">Agent clients</text><rect class="core" x="100" y="665" width="125" height="48" rx="10"/><text class="b" x="137" y="695">Codex</text><rect class="core" x="240" y="665" width="160" height="48" rx="10"/><text class="b" x="271" y="695">Claude Code</text><rect class="core" x="415" y="665" width="125" height="48" rx="10"/><text class="b" x="463" y="695">Pi</text><text class="small" x="100" y="741">Optional OpenClaw host adapter; never required</text><path class="arrow" d="M570 682H640"/><rect class="core" x="640" y="600" width="530" height="165" rx="14"/><text class="h" x="670" y="640">Supported workers + isolated worktrees</text><text class="b" x="670" y="675">One issue · one writer · bounded scope</text><text class="b" x="670" y="705">RED → GREEN · durable checkpoints</text><text class="small" x="670" y="738">Overlapping contracts and files serialize</text><path class="arrowGate" d="M1170 682H1235"/><rect class="gate" x="1235" y="600" width="495" height="165" rx="14"/><text class="h" x="1265" y="640">Switchyard typed capability transport</text><text class="b" x="1265" y="675">Optional · deferred · readiness-gated by #30</text><text class="b" x="1265" y="705">Carries approved typed operations when proven</text><text class="small" x="1265" y="738">Not orchestrator, authority, or direct/local replacement</text><path class="arrow" d="M905 765V815"/>
<text class="section" x="70" y="825">4 · EVIDENCE AND INDEPENDENT REVIEW</text><rect class="core" x="70" y="850" width="300" height="120" rx="14"/><text class="h" x="100" y="892">dotnet build + test</text><text class="b" x="100" y="925">Affected → required full → build</text><text class="small" x="100" y="950">Exact command and head receipts</text><rect class="target" x="395" y="850" width="330" height="120" rx="14"/><text class="h" x="425" y="892">Crap4CSharp</text><text class="b" x="425" y="925">Coverage + complexity evidence</text><text class="small" x="425" y="950">Decoder integrated; policy not approved</text><rect class="gate" x="750" y="850" width="330" height="120" rx="14"/><text class="h" x="780" y="892">Mutate4CSharp</text><text class="b" x="780" y="925">Mutation evidence</text><text class="small" x="780" y="950">External certified; real Forge profile incomplete</text><path class="arrow" d="M1080 910H1140"/><rect class="target" x="1140" y="850" width="590" height="120" rx="14"/><text class="h" x="1170" y="892">Independent exact-head reviewer</text><text class="b" x="1170" y="925">Binds patch, commit, tree, plan, evidence, and findings</text><text class="small" x="1170" y="950">Any later change invalidates stale review</text><path class="arrow" d="M1435 970V1015"/>
<text class="section" x="70" y="1025">5 · PARENT-OWNED PUBLICATION AND RECOVERY</text><rect class="core" x="70" y="1050" width="300" height="90" rx="14"/><text class="h" x="100" y="1090">Explicitly authorized PR</text><text class="small" x="100" y="1118">Exact evaluated head only</text><path class="arrow" d="M370 1095H420"/><rect class="core" x="420" y="1050" width="250" height="90" rx="14"/><text class="h" x="450" y="1090">Hosted CI</text><text class="small" x="450" y="1118">Required checks + readback</text><path class="arrow" d="M670 1095H720"/><rect class="target" x="720" y="1050" width="350" height="90" rx="14"/><text class="h" x="750" y="1090">Protected normal merge</text><text class="small" x="750" y="1118">Separate authorization; exact head</text><path class="arrow" d="M1070 1095H1120"/><rect class="core" x="1120" y="1050" width="610" height="90" rx="14"/><text class="h" x="1150" y="1090">Receipts + recovery reconciliation</text><text class="small" x="1150" y="1118">Local Git · processes · ownership · remote state · safe continuation</text>
</svg>
